name: Unused Java code

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  unused-java-code:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Reviewdog
        uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252
        with:
          reviewdog_version: v0.21.0

      - name: Generate unused-code reports
        run: mvn --batch-mode --no-transfer-progress -Pquality test

      - name: Convert reports to Reviewdog diagnostics
        run: >-
          python scripts/unused-code-to-rdjson.py
          --checkstyle target/checkstyle-result.xml
          --pmd target/pmd.xml
          --output target/unused-code.rdjsonl

      - name: Create pull request review comments
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          reviewdog
          -f=rdjsonl
          -name=unused-java-code
          -reporter=github-pr-review
          -filter-mode=nofilter
          -fail-on-error
          < target/unused-code.rdjsonl

      - name: Create GitHub annotations
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          reviewdog
          -f=rdjsonl
          -name=unused-java-code
          -reporter=github-pr-annotations
          -filter-mode=nofilter
          -fail-on-error
          < target/unused-code.rdjsonl

      - name: Fail when unused code exists
        if: always()
        run: |
          if [ -s target/unused-code.rdjsonl ]; then
            echo "Unused imports or variables were found."
            exit 1
          fi

      - name: Upload unused-code reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unused-java-code-reports
          path: |
            target/checkstyle-result.xml
            target/pmd.xml
            target/unused-code.rdjsonl
          if-no-files-found: warn
