server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: wifi-admin
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  jackson:
    deserialization:
      fail-on-unknown-properties: true

platform:
  url: ${PLATFORM_URL:http://localhost:8080/platform}
  connect-timeout: ${PLATFORM_CONNECT_TIMEOUT:2s}
  read-timeout: ${PLATFORM_READ_TIMEOUT:5s}

logging:
  level:
    com.example.wifiadmin: INFO

database:
  enabled: false

security:
  enabled: false
  issuer-uri: ${SECURITY_ISSUER_URI:}
  audience: ${SECURITY_AUDIENCE:}
  allowed-origins: ${SECURITY_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
