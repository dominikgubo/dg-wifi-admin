services:
  platform-mock:
    image: mockoon/cli:9.2.0
    container_name: platform-mock
    command:
      - --data
      - /data/platform-mock.json
      - --port
      - "3000"
      - --hostname
      - 0.0.0.0
    volumes:
      - ./mockoon/platform-mock.json:/data/platform-mock.json:ro
    ports:
      - "8080:3000"

  keycloak:
    profiles: [security]
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: wifi-admin-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8090
    volumes:
      - ./keycloak/wifi-admin-realm.json:/opt/keycloak/data/import/wifi-admin-realm.json:ro
    ports:
      - "8090:8080"

  postgres:
    profiles: [database]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wifi
      POSTGRES_USER: wifi
      POSTGRES_PASSWORD: wifi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifi -d wifi"]
      interval: 5s
      timeout: 5s
      retries: 10
