services:
  platform-mock:
    image: mockoon/cli:9.2.0
    container_name: platform-mock
    command:
      - --data
      - /data/platform-mock.json
      - --port
      - "3000"
      - --hostname
      - 0.0.0.0
    volumes:
      - ./mockoon/platform-mock.json:/data/platform-mock.json:ro
    ports:
      - "8080:3000"

  postgres:
    profiles: [database]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wifi
      POSTGRES_USER: wifi
      POSTGRES_PASSWORD: wifi
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifi -d wifi"]
      interval: 5s
      timeout: 5s
      retries: 10
